# nginx for the bench/suite. One process, one worker thread: the other servers of
# the suite follow the same model, and the comparison is one thread per core.
#
# Explicitly disabled is whatever would otherwise measure something other than the network:
#   access_log off  — otherwise the speed of writing the log is measured;
#   sendfile off    — Talaria has none, both sides serve files through write;
#   keepalive_requests — the ceiling is lifted, otherwise the connection is re-established
#                        in the middle of a measurement, which shows as a step in the tail.
daemon off;
master_process off;
worker_processes 1;
worker_rlimit_nofile 4096;
error_log error.log crit;
pid nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    default_type text/html;
    access_log off;
    sendfile off;
    tcp_nodelay on;
    tcp_nopush off;
    keepalive_timeout 300s;
    keepalive_requests 100000000;
    server_tokens off;
    client_body_temp_path tmp/body;

    server {
        listen 8080 backlog=4096;
        server_name _;
        root html;

        # /nop — a response entirely from memory: the pure network path without the
        # file system. It is served by empty_gif (43 bytes from a static array): the
        # `return` directive lives in the rewrite module, which pulls PCRE, left out
        # of the build on purpose.
        location = /nop {
            empty_gif;
        }
        # / — a static file from disk: network + file system
        location / {
            index index.html;
        }
    }
}
